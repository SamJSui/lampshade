name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Vulkan software adapter
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run unit and GPU integration tests
        env:
          WGPU_BACKEND: vulkan
        run: cargo test --lib --tests
      - name: Check examples and benchmarks
        run: cargo check --examples --benches
      - name: Check pinned wgpu_sort comparison harness
        run: |
          cargo fmt --manifest-path benchmarks/wgpu-sort-comparison/common/Cargo.toml -- --check
          cargo fmt --manifest-path benchmarks/wgpu-sort-comparison/wgpu-primitives-runner/Cargo.toml -- --check
          cargo fmt --manifest-path benchmarks/wgpu-sort-comparison/wgpu-sort-runner/Cargo.toml -- --check
          cargo test --locked --manifest-path benchmarks/wgpu-sort-comparison/common/Cargo.toml
          cargo clippy --locked --manifest-path benchmarks/wgpu-sort-comparison/common/Cargo.toml -- -D warnings
          cargo clippy --locked --manifest-path benchmarks/wgpu-sort-comparison/wgpu-primitives-runner/Cargo.toml -- -D warnings
          cargo clippy --locked --manifest-path benchmarks/wgpu-sort-comparison/wgpu-sort-runner/Cargo.toml -- -D warnings
      - name: Check documentation
        run: cargo test --doc
      - name: Verify package contents
        run: cargo package
      - name: Check deprecated compatibility package
        run: |
          cargo fmt --manifest-path compat/wgpu-algorithms/Cargo.toml -- --check
          cargo clippy --manifest-path compat/wgpu-algorithms/Cargo.toml -- -D warnings
      - name: List compatibility package contents
        run: cargo package --list --manifest-path compat/wgpu-algorithms/Cargo.toml
