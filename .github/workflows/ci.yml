name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Vulkan software adapter
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run unit and GPU integration tests
        env:
          WGPU_BACKEND: vulkan
          LAMPSHADE_REQUIRE_GPU_TESTS: "1"
        run: cargo test --release --lib --tests
      - name: Check examples and benchmarks
        run: cargo check --release --examples --benches
      - name: Check standalone particle consumer
        run: |
          cargo fmt --manifest-path validation/particle-app/Cargo.toml -- --check
          cargo clippy --locked --manifest-path validation/particle-app/Cargo.toml -- -D warnings
          python3 validation/particle-app/run.py --quick --backend vulkan --items 4096 --processes 1 --warmups 1 --iterations 2 --output target/particle-consumer-ci.json
      - name: Check pinned wgpu_sort comparison harness
        run: |
          cargo fmt --manifest-path benchmarks/wgpu-sort-comparison/common/Cargo.toml -- --check
          cargo fmt --manifest-path benchmarks/wgpu-sort-comparison/lampshade-runner/Cargo.toml -- --check
          cargo fmt --manifest-path benchmarks/wgpu-sort-comparison/wgpu-sort-runner/Cargo.toml -- --check
          cargo test --locked --manifest-path benchmarks/wgpu-sort-comparison/common/Cargo.toml
          python3 -m unittest discover -s benchmarks/wgpu-sort-comparison -p test_aggregate.py
          cargo clippy --locked --manifest-path benchmarks/wgpu-sort-comparison/common/Cargo.toml -- -D warnings
          cargo clippy --locked --manifest-path benchmarks/wgpu-sort-comparison/lampshade-runner/Cargo.toml -- -D warnings
          cargo clippy --locked --manifest-path benchmarks/wgpu-sort-comparison/wgpu-sort-runner/Cargo.toml -- -D warnings
      - name: Check pinned Massively comparison harness
        run: |
          cargo fmt --manifest-path benchmarks/massively-comparison/common/Cargo.toml -- --check
          cargo fmt --manifest-path benchmarks/massively-comparison/lampshade-runner/Cargo.toml -- --check
          cargo fmt --manifest-path benchmarks/massively-comparison/massively-runner/Cargo.toml -- --check
          cargo test --locked --manifest-path benchmarks/massively-comparison/common/Cargo.toml
          python3 -m unittest discover -s benchmarks/massively-comparison -p test_aggregate.py
          cargo clippy --locked --manifest-path benchmarks/massively-comparison/common/Cargo.toml -- -D warnings
          cargo clippy --locked --manifest-path benchmarks/massively-comparison/lampshade-runner/Cargo.toml -- -D warnings
          cargo clippy --locked --manifest-path benchmarks/massively-comparison/massively-runner/Cargo.toml -- -D warnings
      - name: Check published-release regression harness
        run: |
          cargo fmt --manifest-path benchmarks/release-regression/published-runner/Cargo.toml -- --check
          cargo clippy --locked --manifest-path benchmarks/release-regression/published-runner/Cargo.toml -- -D warnings
          python3 -m unittest discover -s benchmarks/release-regression -p test_run.py
          python3 benchmarks/release-regression/run.py --quick --backend vulkan --output target/release-regression/ci.json
      - name: Check documentation
        run: cargo test --doc
      - name: Verify package contents
        run: cargo package
      - name: Check final wgpu-primitives compatibility package
        run: |
          cargo fmt --manifest-path compat/wgpu-primitives/Cargo.toml -- --check
          cargo clippy --manifest-path compat/wgpu-primitives/Cargo.toml -- -D warnings
      - name: Verify compatibility package artifact
        run: cargo package --manifest-path compat/wgpu-primitives/Cargo.toml
