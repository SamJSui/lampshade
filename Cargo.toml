[package]
name = "lampshade"
version = "0.11.0"
edition = "2024"
rust-version = "1.87.0"
description = "Fast, composable GPU primitives for Rust applications using wgpu and WGSL."
authors = ["samjsui"]
license = "MIT"
repository = "https://github.com/samjsui/lampshade"
keywords = ["gpgpu", "wgpu", "sort", "radix", "compute"]
categories = ["algorithms", "graphics", "science"]
include = [
    "src/**/*.rs",
    "src/**/*.wgsl",
    "tests/**/*.rs",
    "benches/**/*.rs",
    "benches/**/*.wgsl",
    "benchmarks/**/*.md",
    "benchmarks/*.json",
    "docs/**/*.md",
    "examples/**/*.rs",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[dependencies]
wgpu = "29.0.4"
bytemuck = { version = "1.24", features = ["derive"] }
futures = "0.3.31"
log = "0.4.29"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
rand = "0.9.2"
pollster = "0.4"
env_logger = "0.11.8"
criterion = { version = "0.8.1", features = ["async_tokio", "html_reports"] }
rayon = "1.10"

[[bench]]
name = "sort"
harness = false

[[bench]]
name = "scan"
harness = false

[[bench]]
name = "key_value_sort"
harness = false

[[bench]]
name = "key_value_soa"
harness = false

[[bench]]
name = "compact"
harness = false

[[bench]]
name = "key_value_compact"
harness = false

[[bench]]
name = "predicate"
harness = false

[[bench]]
name = "reduce"
harness = false

[[bench]]
name = "histogram"
harness = false

[[bench]]
name = "counted_pipeline"
harness = false

[[bench]]
name = "particle_pipeline"
harness = false

[[bench]]
name = "run_length"
harness = false

[[bench]]
name = "argmin"
harness = false
